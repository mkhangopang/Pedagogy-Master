name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
    - run: npm install
    - run: npm run build
    - run: npm run test
    - name: Fix audit (best-effort)
      run: npm audit fix || true
    - name: Check for high severity vulnerabilities (do not fail pipeline)
      run: npm audit --audit-level=high || true
