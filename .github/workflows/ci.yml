name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'   # use the active LTS
    - run: npm install          # use npm install to avoid ci failures with local file deps
    - run: npm run build
    - run: npm run test
    - run: npm audit --audit-level=high
